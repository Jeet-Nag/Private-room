# ==============================================================================
# PHANTOM ROOM — NETLIFY FRONTEND DEPLOYMENT CONFIGURATION
# ==============================================================================
# Standalone Next.js Frontend Deployment on Netlify
# ==============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Enable camera, microphone, and display-capture in the secure origin context
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self)"
